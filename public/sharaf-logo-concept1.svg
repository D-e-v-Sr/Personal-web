<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <defs>
    <style>
      .path-main { fill: currentColor; }
    </style>
  </defs>
  
  <!-- S - Continuous code path starting top-left, flowing like execution trace -->
  <path class="path-main" d="M20 30 
    C20 15, 55 15, 55 15 
    C70 15, 80 25, 80 40 
    C80 55, 55 65, 55 65 
    C40 65, 20 75, 20 90 
    C20 105, 55 105, 55 105 
    C70 105, 80 95, 80 80 
    C80 65, 55 55, 55 55 
    C40 55, 20 45, 20 30 Z" transform="translate(0,0)"/>
  
  <!-- H - Structural bracket geometry, two verticals connected by crossbar like a code block -->
  <g transform="translate(100, 0)">
    <!-- Left vertical with bracket-inspired terminals -->
    <path class="path-main" d="M0 20 
      L0 140 
      L8 140 
      L8 20 
      L0 20 Z"/>
    <!-- Right vertical -->
    <path class="path-main" d="M48 20 
      L48 140 
      L56 140 
      L56 20 
      L48 20 Z"/>
    <!-- Crossbar - like a horizontal brace connection -->
    <path class="path-main" d="M8 74 
      L24 74 
      C28 74, 32 70, 32 66 
      L32 50 
      C32 46, 28 42, 24 42 
      L8 42 
      L8 74 Z"/>
  </g>
  
  <!-- A - Angular digital form with crossbar like a code path junction -->
  <g transform="translate(170, 0)">
    <!-- Left stem with angular cut -->
    <path class="path-main" d="M28 140 
      L20 140 
      L12 30 
      L20 30 
      L28 42 
      L28 140 Z"/>
    <!-- Right stem with angular cut -->
    <path class="path-main" d="M36 140 
      L44 140 
      L52 30 
      L44 30 
      L36 42 
      L36 140 Z"/>
    <!-- Crossbar - digital geometry, like a path junction -->
    <path class="path-main" d="M18 76 
      L24 76 
      L24 70 
      L40 70 
      L40 76 
      L46 76 
      L46 84 
      L40 84 
      L40 78 
      L24 78 
      L24 84 
      L18 84 Z"/>
  </g>
  
  <!-- R - Bracket-inspired with distinctive code-path leg -->
  <g transform="translate(245, 0)">
    <!-- Vertical stem with bracket terminal -->
    <path class="path-main" d="M0 20 
      L0 140 
      L8 140 
      L8 20 
      L0 20 Z"/>
    <!-- Bowl - angular, like a code block -->
    <path class="path-main" d="M8 20 
      L36 20 
      L44 20 
      L44 28 
      L24 28 
      C32 28, 38 36, 38 50 
      C38 64, 32 72, 24 72 
      L8 72 
      L8 20 Z"/>
    <!-- Leg - distinctive path-like diagonal with terminal -->
    <path class="path-main" d="M20 72 
      L28 72 
      L42 140 
      L50 140 
      L36 72 
      L20 72 Z"/>
  </g>
  
  <!-- A (second) - Matching first A geometry -->
  <g transform="translate(320, 0)">
    <path class="path-main" d="M28 140 
      L20 140 
      L12 30 
      L20 30 
      L28 42 
      L28 140 Z"/>
    <path class="path-main" d="M36 140 
      L44 140 
      L52 30 
      L44 30 
      L36 42 
      L36 140 Z"/>
    <path class="path-main" d="M18 76 
      L24 76 
      L24 70 
      L40 70 
      L40 76 
      L46 76 
      L46 84 
      L40 84 
      L40 78 
      L24 78 
      L24 84 
      L18 84 Z"/>
  </g>
  
  <!-- F - Terminal/bracket inspired terminals, clean structural form -->
  <g transform="translate(395, 0)">
    <!-- Vertical stem with top bracket terminal -->
    <path class="path-main" d="M0 20 
      L0 140 
      L8 140 
      L8 20 
      L0 20 Z"/>
    <!-- Top horizontal - extended with bracket-like end -->
    <path class="path-main" d="M8 20 
      L52 20 
      L52 28 
      L16 28 
      L16 36 
      L52 36 
      L52 44 
      L8 44 
      L8 20 Z"/>
    <!-- Middle horizontal - shorter, like a nested block -->
    <path class="path-main" d="M8 76 
      L40 76 
      L40 84 
      L8 84 
      L8 76 Z"/>
  </g>
</svg>